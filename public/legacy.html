<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!-- ARTIFACT-START -->
<title>Мегалюль 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: full-screen 3D view, a thin telemetry row on top, big centered messages, invisible steering halves on touch screens.
   One look only: a fjord at dusk. Teal water, dark pine slopes, peach-to-plum sky, amber port lamps. */
:root {
  --bg: #1b1a2e;
  --panel: rgba(16, 20, 38, 0.72);
  --edge: rgba(255, 255, 255, 0.14);
  --fg: #f1eef6;
  --muted: #a9a6bd;
  --accent: #ffb347;
  --ok: #6fdc8c;
  --warn: #f5c044;
  --bad: #f4705f;
  --display: 'Russo One', 'Arial Black', Impact, sans-serif;
  --ui: 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 14px; overflow: hidden; -webkit-text-size-adjust: 100%; }
#app { position: relative; height: 100%; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#hud {
  position: absolute; left: 0; right: 0; top: 0;
  display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: stretch;
  padding-block: calc(10px + env(safe-area-inset-top, 0px)) 0; padding-inline: 16px;
  pointer-events: none; font-variant-numeric: tabular-nums;
}
.tile { background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 6px 12px; min-width: 70px; backdrop-filter: blur(6px); }
.tile .label { display: block; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.tile .value { display: block; font-size: 18px; font-weight: 500; line-height: 1.2; }
.tile .value.warn { color: var(--warn); }
.tile .value.bad { color: var(--bad); }
.tile.brand { font-family: var(--display); color: var(--accent); font-size: 16px; letter-spacing: 0.04em; display: flex; align-items: center; margin-right: auto; }
.cargo { min-width: 150px; }
.bar { height: 8px; margin-top: 6px; background: rgba(0,0,0,0.4); border: 1px solid var(--edge); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--ok); transition: width 0.15s linear, background 0.3s; }
.boost { min-width: 120px; }
.boost .bar i { background: var(--accent); width: 0; }
.boost.full .bar i { box-shadow: 0 0 10px var(--accent); }
.tile.mute { pointer-events: auto; cursor: pointer; color: var(--muted); font: inherit; font-size: 12px; min-width: 0; }
.tile.mute:hover, .tile.mute:focus-visible { color: var(--fg); outline: none; border-color: rgba(255,255,255,0.35); }
.tile .value.late { color: var(--bad); }
#msg {
  position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none;
  font-family: var(--display); font-size: clamp(20px, 4vw, 34px); letter-spacing: 0.05em; color: var(--fg);
  text-shadow: 0 2px 18px rgba(0,0,0,0.6); opacity: 0; transition: opacity 0.3s;
}
#msg.show { opacity: 1; }
#overlay {
  position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto;
  background: rgba(12, 10, 26, 0.66); padding: 16px; box-sizing: border-box; text-align: center; backdrop-filter: blur(3px);
}
#overlay[hidden] { display: none; }
#overlay .card { max-width: 480px; width: 100%; margin: auto; }
#overlay .card.shop { max-width: 820px; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; text-align: left; margin: 12px 0 16px; }
.item { background: var(--panel); border: 1px solid var(--edge); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; min-width: 0; }
.item-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.item-head b { font-weight: 500; }
.pips { letter-spacing: 3px; font-size: 12px; white-space: nowrap; }
.pips .on { color: var(--accent); }
.pips .off { color: rgba(255,255,255,0.18); }
.item p { font-size: 12px; color: var(--muted); margin: 4px 0 6px; line-height: 1.4; flex: 1; }
.item-fx { font-size: 11px; letter-spacing: 0.04em; color: var(--fg); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.buy { width: 100%; padding: 8px 10px; border-radius: 5px; border: 1px solid var(--accent); background: transparent; color: var(--accent); font: 500 13px var(--ui); cursor: pointer; }
.buy:hover:not([disabled]), .buy:focus-visible { background: rgba(255,179,71,0.15); outline: none; }
.buy[disabled] { opacity: 0.4; cursor: default; }
.btn.alt { background: transparent; color: var(--fg); border: 1px solid var(--edge); }
.btn + .btn { margin-left: 8px; }
#overlay h1 { font-family: var(--display); font-size: clamp(32px, 8vw, 58px); letter-spacing: 0.05em; line-height: 1; margin: 0 0 4px; color: var(--accent); text-wrap: balance; text-shadow: 0 4px 28px rgba(255,179,71,0.35); }
#overlay h2 { font-family: var(--display); font-size: clamp(22px, 5vw, 32px); margin: 0 0 10px; letter-spacing: 0.04em; text-wrap: balance; }
#overlay .sub { color: var(--muted); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 18px; }
#overlay p { margin: 6px 0; line-height: 1.5; }
#overlay .rules { text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 14px auto 18px; max-width: 380px; font-size: 13px; }
#overlay .rules b { font-weight: 500; }
#overlay .rules span { color: var(--muted); }
kbd { display: inline-block; min-width: 14px; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); border: 1px solid var(--edge); border-bottom-width: 2px; font: 12px var(--ui); color: var(--fg); }
.score-table { display: grid; grid-template-columns: 1fr auto; gap: 4px 20px; max-width: 300px; margin: 10px auto 16px; font-variant-numeric: tabular-nums; }
.score-table span:nth-child(even) { text-align: right; font-weight: 500; }
.score-table .total { border-top: 1px solid var(--edge); padding-top: 6px; margin-top: 4px; color: var(--accent); font-weight: 700; }
.stars { font-size: 26px; letter-spacing: 6px; color: var(--accent); margin-bottom: 6px; }
.stars .dim { color: rgba(255,255,255,0.18); }
/* the shipyard hub: its own screen over the paused 3D view, four buildings on a quay, a panel per room */
#hub { position: absolute; inset: 0; display: flex; flex-direction: column; background: #1b1a2e; }
#hub[hidden] { display: none; }
.hub-top { display: flex; flex-wrap: wrap; gap: 8px 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 0; font-variant-numeric: tabular-nums; }
.hub-top .tile { pointer-events: auto; }
.hub-top .tile.brand { margin-right: auto; }
.hub-top .tile.stock .value { font-size: 15px; }
.hub-top .xp { width: 90px; margin-left: 6px; }
.hub-scene { flex: 1; width: 100%; min-height: 0; display: block; }
.room { cursor: pointer; outline: none; }
.room .halo { opacity: 0; transition: opacity 0.2s; }
.room:hover .halo, .room:focus-visible .halo, .room.on .halo { opacity: 1; }
.room .name { font-family: var(--display); font-size: 22px; letter-spacing: 0.06em; fill: #f1eef6; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,0.45); stroke-width: 4px; }
.room .lvl { font-family: var(--ui); font-size: 13px; letter-spacing: 0.12em; fill: #ffb347; text-anchor: middle; }
.room .note { font-family: var(--ui); font-size: 13px; fill: #d9d4e4; text-anchor: middle; }
.hub-foot { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
#hubPanel { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 16px; box-sizing: border-box; background: rgba(12, 10, 26, 0.72); backdrop-filter: blur(3px); text-align: center; }
#hubPanel[hidden] { display: none; }
#hubPanel .card { max-width: 820px; width: 100%; margin: auto; }
#hubPanel h2 { font-family: var(--display); font-size: clamp(22px, 5vw, 32px); margin: 0 0 4px; letter-spacing: 0.04em; }
#hubPanel .sub { color: var(--muted); font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 14px; }
#hubPanel p { margin: 6px 0; line-height: 1.5; }
.panel-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: center; margin-bottom: 12px; }
.panel-head .buy { width: auto; }
.close { position: absolute; top: 14px; right: 16px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--edge); background: var(--panel); color: var(--fg); font: 18px/1 var(--ui); cursor: pointer; }
.close:hover { border-color: rgba(255,255,255,0.4); }
.prod { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin: 10px 0 14px; text-align: left; }
.prod .item .big { font-family: var(--display); font-size: 26px; color: var(--accent); letter-spacing: 0.03em; }
.prod .bar { margin-top: 8px; }
.prod .bar i { background: var(--accent); transition: width 0.5s linear; }
.item.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.item.locked { opacity: 0.55; }
.item p b { font-weight: 500; color: var(--fg); }
.tag { display: inline-block; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: rgba(255,255,255,0.08); color: var(--muted); margin-left: 6px; vertical-align: middle; white-space: nowrap; }
.tag.hot { background: rgba(244,112,95,0.2); color: var(--bad); }
.tag.night { background: rgba(127,211,255,0.15); color: #7fd3ff; }
.stat { display: grid; grid-template-columns: 74px 1fr; gap: 4px 8px; align-items: center; font-size: 11px; color: var(--muted); margin: 4px 0 10px; }
.stat .bar { margin: 0; height: 6px; }
.stat .bar i { background: var(--accent); transition: none; }
.pay { font-family: var(--display); font-size: 18px; color: var(--accent); letter-spacing: 0.03em; margin-top: 4px; }
.meta { font-size: 11px; color: var(--muted); letter-spacing: 0.04em; margin: 2px 0 8px; }
.rankup { background: rgba(255,179,71,0.14); border: 1px solid var(--accent); border-radius: 6px; padding: 8px 12px; margin: 10px auto; max-width: 380px; font-size: 13px; }
.xp { width: 120px; height: 6px; background: rgba(0,0,0,0.4); border: 1px solid var(--edge); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; }
.xp i { display: block; height: 100%; background: var(--accent); }
#hubPanel h2.sub2 { font-size: 20px; margin: 18px 0 8px; }
@media (max-width: 560px) { .room .name { font-size: 30px; } .room .lvl, .room .note { font-size: 18px; } .hub-top .tile.optional { display: none; } }
.btn { display: inline-block; margin-top: 6px; padding: 10px 24px; border-radius: 6px; cursor: pointer; background: var(--accent); color: #1a1206; border: none; font: 500 15px var(--ui); letter-spacing: 0.02em; }
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
#radio {
  position: absolute; left: 16px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); max-width: min(460px, calc(100% - 32px));
  background: var(--panel); border: 1px solid var(--edge); border-left: 4px solid var(--accent); border-radius: 6px; padding: 8px 12px;
  backdrop-filter: blur(6px); pointer-events: none; font-size: 14px; line-height: 1.35; animation: radioIn 0.25s ease-out; box-sizing: border-box;
}
#radio.disp { border-left-color: #7fd3ff; }
#radio .who { display: block; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
#radio.disp .who { color: #7fd3ff; }
#radio.both { border-left-color: #c9a0ff; }
#radio.both .who { color: #c9a0ff; }
#radio[hidden] { display: none; }
@keyframes radioIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (pointer: coarse) { #radio { left: 16px; right: 16px; max-width: none; bottom: calc(152px + env(safe-area-inset-bottom, 0px)); } }
@media (prefers-reduced-motion: reduce) { #radio { animation: none; } }
#touch { position: absolute; inset: 0; display: none; pointer-events: none; }
#touch .zone { position: absolute; top: 25%; bottom: 0; width: 50%; pointer-events: auto; touch-action: none; }
#touch .zone.l { left: 0; } #touch .zone.r { right: 0; }
#touch .zone::after {
  content: ''; position: absolute; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); width: 44px; height: 44px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.25); background: rgba(16,20,38,0.4);
}
#touch .zone.l::after { left: 22px; } #touch .zone.r::after { right: 22px; }
#touch .zone.on::after { background: rgba(255,179,71,0.5); border-color: var(--accent); }
#touch .brake {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  width: 120px; height: 52px; border-radius: 26px; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none;
  background: var(--panel); color: var(--fg); border: 1px solid var(--edge); font: 500 14px var(--ui); letter-spacing: 0.1em;
}
#touch .brake.on { background: rgba(244,112,95,0.6); }
@media (pointer: coarse) { #touch { display: block; } }
@media (max-width: 560px) {
  .tile { padding: 5px 9px; min-width: 56px; }
  .tile .value { font-size: 15px; }
  .cargo { min-width: 100px; }
  .boost { min-width: 90px; }
  .tile.optional { display: none; }
  #overlay .rules { display: none; }
}
@media (prefers-reduced-motion: reduce) { .bar i, #msg { transition: none; } }
</style>

    if (boosting && !G.boosting) { sfx('boost'); quip('boost'); }
    G.boosting = boosting;
    if (boosting) G.boost = Math.max(0, G.boost - 30 * dt);
    // throttle: no automatic slowing down, the helm decides when to stop
    var target = boosting ? boostSpeed() : cruiseSpeed();

    if (keys.down) target = (vF > 0.6 || toDock < 70) ? 0 : -3;   // holding the brake at a standstill backs up, except at the berth
    var accel = target > vF ? (boosting ? 10 : 6.5 + upLevel('engine')) : (keys.down ? 10 : 4);

  function delivered(ds) {
    G.mode = 'docked'; G.lastOutcome = 'docked'; sfx('dock'); stopVoice(); quip('dock');
    var j = G.job, base = jobPay(j), cargoPay = Math.round(base * G.cargo / 100 * (G.late ? 0.5 : 1));
    var timeBonus = Math.round(Math.max(0, G.timeLeft) * 12);
    var driftBonus = Math.round(G.drift), nm = Math.round(G.nearMiss);
    var total = cargoPay + timeBonus + driftBonus + nm;
    var stars = G.cargo >= 90 ? 3 : G.cargo >= 60 ? 2 : 1, starHtml = '';
    var xp = Math.round(j.xp * (0.5 + 0.5 * G.cargo / 100) * (G.late ? 0.7 : 1)) + 10 * stars + Math.round(driftBonus / 60);
    G.money += total; G.earned += total; G.done += 1;
    var ups = addXp(xp); newBoard(); accrue(); saveGame();
    for (var i = 0; i < 3; i++) starHtml += i < stars ? '★' : '<span class="dim">★</span>';
    show('<div class="card"><div class="stars">' + starHtml + '</div><h2>Груз доставлен</h2><div class="sub">' + ROUTE[j.region].name + ' · ' + j.port + ' · ' + tankWord(j.amount) + ' · груз ' + Math.round(G.cargo) + '% · ' + fmtTime(G.time) + (G.late ? ' · с опозданием' : '') + '</div>' +
      '<div class="score-table"><span>Оплата за груз' + (G.late ? ' (×0,5 за опоздание)' : '') + '</span><span>' + fmt(cargoPay) + '</span>' +
      '<span>Запас времени</span><span>' + fmt(timeBonus) + '</span><span>Премия за дрифт</span><span>' + fmt(driftBonus) + '</span>' +
      '<span>Впритирку</span><span>' + fmt(nm) + '</span>' + (G.pickupCash ? '<span>Бочки по пути (уже на счету)</span><span>' + fmt(G.pickupCash) + '</span>' : '') +
      '<span class="total">Итого</span><span class="total">' + fmt(total) + ' ₽</span></div>' +
      '<p class="hint">Опыт +' + xp + ' · на счету ' + fmt(G.money) + ' ₽ · рейсов ' + G.done + ' · на складе ' + tankWord(stockWhole()) + '</p>' +
      (ups ? '<div class="rankup">Новый разряд: ' + G.rank + '-й. На верфи открылись новые улучшения.</div>' : '') +
      '<div id="olResult"></div>' + btn('На верфь', 'primary') + spaceHint() + '</div>');
    Online.panel(document.getElementById('olResult'), { game: '3d', mode: 'result', score: G.earned, level: G.done });
    saveHot();
  }
  function fail() {
    G.mode = 'fail'; G.lastOutcome = 'fail'; shipG.visible = false; G.shake = 3; sfx('fail'); saveGame(); stopVoice(); quip('fail');
    for (var i = 0; i < 60; i++) spawn(sparks, S.x, 2, S.z, (Math.random() - 0.5) * 30, 4 + Math.random() * 14, (Math.random() - 0.5) * 30, 1.2);
    show('<div class="card"><h2>Груз потерян</h2><div class="sub">цистерны пусты · ' + fmt(Math.max(0, C.dockS - S.s)) + ' м до порта</div>' +
      '<p>Берег, камни и чужие борта оказались крепче. Партия пропала: на повтор рейса цех нальёт новую, деньги за прошлые рейсы и бочки остаются, на верфи можно поставить кранцы или взять заказ полегче.</p>' +
      btn('На верфь', 'hub', true) + btn('Повторить рейс', 'primary') + spaceHint() + '<div class="ol-foot">' + Online.feedbackLink('3d') + '</div></div>');
    saveHot();
  }
  function primaryAction() {
    if (G.mode === 'title') { if (loadGame()) continueGame(); else newGame(); }
    else if (G.mode === 'hub') { accrue(); var list = board(); for (var i = 0; i < list.length; i++) if (!canTake(list[i])) { takeJob(i); return; } if (!G.room) hubScreen('plant'); }
    else if (G.mode === 'docked') hubScreen();
    else if (G.mode === 'fail') retryJob();
    else if (G.mode === 'pause') togglePause();
  }
  function togglePause() {
    if (G.mode === 'play') { G.mode = 'pause'; show('<div class="card"><h2>Пауза</h2>' + btn('Продолжить', 'primary') + spaceHint() + '<div class="ol-foot">' + Online.feedbackLink('3d') + '</div></div>'); }
    else if (G.mode === 'pause') { G.mode = 'play'; hide(); }
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden && G.mode === 'play') togglePause(); });
  function saveHot() { try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(saveData()); } catch (e) {} }

  // ---------- input ----------
  var KEYMAP = { ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
  window.addEventListener('keydown', function (e) {
    if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;   // идёт ввод имени или отзыва
    if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); return; }
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); primaryAction(); }
    else if (e.code === 'KeyP' || e.code === 'Escape') { if (G.mode === 'hub') { if (G.room) hubScreen(); } else togglePause(); }
    else if (e.code === 'KeyM') toggleMute();
    else if (G.mode === 'hub' && G.room === 'dock' && /^Digit[1-5]$/.test(e.code)) buyTune(TUNING[parseInt(e.code.slice(5), 10) - 1].key);
  });
  window.addEventListener('keyup', function (e) { if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = false; e.preventDefault(); } });
  window.addEventListener('blur', function () { keys.up = keys.down = keys.left = keys.right = false; });
  Array.prototype.forEach.call(document.querySelectorAll('#touch [data-key]'), function (b) {
    var k = b.getAttribute('data-key');
    function on(e) { e.preventDefault(); keys[k] = true; b.classList.add('on'); }
    function off(e) { e.preventDefault(); keys[k] = false; b.classList.remove('on'); }
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  });

  // ---------- resize and main loop ----------
  function resize() {
    var w = canvas.clientWidth || window.innerWidth, h = canvas.clientHeight || window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();
  var last = 0;
  function tick(dt) { update(dt); if (S) updateCamera(dt, false); stepMsg(dt); stepRadio(dt); updateHud(); if (G.mode !== 'hub') renderer.render(scene, camera); }   // the hub covers the view, no point drawing under it
  function frame(ts) {
    if (!last) last = ts;
    var dt = Math.min(0.05, (ts - last) / 1000); last = ts;
    tick(dt);
    requestAnimationFrame(frame);
  }
  var AUTOTEST = location.hash === '#autotest';
  function start(data) {
    var fromHot = !!(data && (data.v || data.level));
    if (fromHot) applySave(data); else { var s = loadGame(); if (s) applySave(s); else resetCareer(); }
    G.job = board()[0]; applyTanker(tanker());   // the first offer makes the backdrop behind the title
    C = buildCourse(G.job); buildWorld(C); resetShip();
    if (fromHot) { G.mode = 'docked'; G.lastOutcome = 'docked'; show('<div class="card"><h2>Рейс прерван</h2><div class="sub">страница обновилась</div><p>Заработок, склад, флот и постройки сохранены. Заказ можно взять заново в конторе.</p>' + btn('На верфь', 'primary') + spaceHint() + '</div>'); }
    else titleScreen();
    if (location.hash === '#photo') hide();   // a still of the ship with no menu in the way
    if (document.fonts && document.fonts.load) document.fonts.load("150px 'Russo One'").then(function () { if (labelTex) { labelTex.image = makeLabel(tanker().label, '#fff6e8', 'rgba(0,0,0,0)', 150).image; labelTex.needsUpdate = true; } }).catch(function () {});
    if (!AUTOTEST) requestAnimationFrame(frame);
    else { // dormant smoke test, only with #autotest in the address: fixed steps on a timer, an autopilot at the helm
      muted = true; renderer.setPixelRatio(0.35); renderer.shadowMap.enabled = false;
      setInterval(function () { tick(0.1); }, 100);
      setTimeout(primaryAction, 300); setTimeout(primaryAction, 600);   // title, then the hub, then the first contract
      setInterval(function () {
        if (G.mode !== 'play') return;
        var q = nearest(C, S.x, S.z, S.idx), inBasin = q.s > C.runLen - 40;
        var aim = inBasin ? C.dock : atS(C, q.s + 45, 0);
        var want = Math.atan2(aim.z - S.z, aim.x - S.x) + (inBasin ? 0 : Math.sin(G.t * 0.6) * 0.3);
        var err = angDiff(want, S.a);
        var dd = Math.sqrt((C.dock.x - S.x) * (C.dock.x - S.x) + (C.dock.z - S.z) * (C.dock.z - S.z));
        if (inBasin && dd < 20) { var e2 = angDiff(C.dock.a, S.a); keys.right = e2 > 0.05; keys.left = e2 < -0.05; } else { keys.right = err > 0.05; keys.left = err < -0.05; }
        keys.up = !inBasin && G.boost > 40;
        keys.down = inBasin && (dd < S.sp * S.sp / 18 + 6 || dd < 14);
      }, 100);
      setInterval(function () {
        console.log('autotest', G.mode, 'done=' + G.done, 'rank=' + G.rank, 'xp=' + G.xp, 'stock=' + G.stock.toFixed(1), 'job=' + (G.job ? ROUTE[G.job.region].name + '/' + G.job.port + '/d' + G.job.diff + '/' + G.job.amount + 'c' : '-'), 'cargo=' + Math.round(G.cargo), 's=' + (S ? Math.round(S.s) : '-'), 'sp=' + (S ? S.sp.toFixed(1) : '-'), 'money=' + G.money, 'drift=' + Math.round(G.drift));
        if (G.mode === 'docked' || G.mode === 'fail' || G.mode === 'hub') primaryAction();
      }, 3000);
    }
  }
  var hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(start); else start(hot && hot.data ? hot.data : {});
})();
</script>
