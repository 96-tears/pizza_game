# Пример для nginx: статика игры из папки dist/ после npm run build. Положить в /etc/nginx/sites-available/megalul,
# включить символической ссылкой в sites-enabled, HTTPS добавить certbot'ом, затем: sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name game.example.ru;
    root /var/www/megalul;
    index index.html;
    gzip on;
    gzip_types text/html text/javascript application/javascript application/manifest+json image/svg+xml;
    location ~ ^/(js|vendor)/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ =404; }
}
